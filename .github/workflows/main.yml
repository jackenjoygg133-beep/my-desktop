name: Linux Ubuntu - Connexion SSH via Tailscale

on:
  workflow_dispatch:

jobs:
  ssh-access:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Connexion et configuration Tailscale
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
        tailscaled-args: --ssh # Version corrigée pour activer Tailscale SSH !

    - name: Garder le runner actif (Bloquer le script pendant 1 heure)
      run: |
        echo "=========================================================="
        echo "Le runner Ubuntu est prêt pour la connexion SSH !"
        echo "=========================================================="
        sleep 3600

