name: Windows - Connexion SSH via Tailscale

on:
  workflow_dispatch:

jobs:
  ssh-access:
    runs-on: windows-latest
    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Connexion et configuration Tailscale
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

    - name: Installer et Activer le Serveur OpenSSH Windows
      run: |
        Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 -ErrorAction SilentlyContinue
        Start-Service sshd
        Set-Service -Name sshd -StartupType 'Automatic'
        New-NetFirewallRule -Name "SSH" -DisplayName "Allow SSH" -Description "Allow SSH" -Profile Any -Direction Inbound -Action Allow -Protocol TCP -LocalPort 22
      shell: powershell

    - name: Garder le runner actif (Bloquer le script pendant 1 heure)
      run: |
        Write-Host "=========================================================="
        Write-Host "Le runner Windows est prêt pour la connexion SSH !"
        Write-Host "1. Récupérez la nouvelle IP dans votre application Tailscale."
        Write-Host "2. Connectez-vous avec : ssh runneradmin@VOTRE_NOUVELLE_IP"
        Write-Host "=========================================================="
        Start-Sleep -Seconds 3600
      shell: powershell
