name: Linux Ubuntu - SSH Connection via Tailscale

on:
  workflow_dispatch:

jobs:
  ssh-access:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Manual Tailscale Installation and Connection
      run: |
        curl -fsSL https://tailscale.com | sh
        sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --ssh
      shell: bash

    - name: Keep runner active (Block script for 1 hour)
      run: |
        echo "=========================================================="
        echo "The Ubuntu runner is finally ready and connected!"
        echo "=========================================================="
        sleep 3600
      shell: bash
