name: Linux Ubuntu - SSH Connection via Tailscale

on:
  workflow_dispatch:

jobs:
  ssh-access:
    runs-on: ubuntu-latest
    steps:
    - name: Tailscale Connection
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

    - name: Configure SSH Authorized Keys
      run: |
        mkdir -p ~/.ssh
        echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILMciCqlUprTSVzpd0+7/A1w7sB4+efxcNl5nvIOQPWe jackenjoygg133-beep" > ~/.ssh/authorized_keys
        chmod 700 ~/.ssh
        chmod 600 ~/.ssh/authorized_keys

    - name: Keep runner active (Block script for 1 hour)
      run: sleep 3600
