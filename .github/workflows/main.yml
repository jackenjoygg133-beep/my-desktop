name: Linux Ubuntu - SSH Connection via Tailscale

on:
  workflow_dispatch:

jobs:
  ssh-access:
    runs-on: ubuntu-latest
    steps:
    - name: Tailscale Connection
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

    - name: Set Password and Print in Logs
      run: |
        echo "=========================================="
        echo "YOUR SSH PASSWORD IS: MyGitHubPass123"
        echo "=========================================="
        echo "ubuntu:MyGitHubPass123" | sudo chpasswd

    - name: Keep runner active (Block script for 1 hour)
      run: sleep 3600
